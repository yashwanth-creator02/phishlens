name: deploy-space

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "Dockerfile.space"
      - "deploy/space/**"
      - ".github/workflows/deploy-space.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hugging Face client
        run: pip install "huggingface_hub>=0.27"

      - name: Upload Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          space_id = os.environ["HF_SPACE_ID"]
          api = HfApi(token=token)
          api.create_repo(repo_id=space_id, repo_type="space", space_sdk="docker", exist_ok=True)
          api.upload_folder(
              repo_id=space_id,
              repo_type="space",
              folder_path="backend",
              ignore_patterns=[".venv/**", "**/__pycache__/**", "models/**", "storage/**", "reports/**", "*.db", "data/raw/**"],
          )
          api.upload_file(repo_id=space_id, repo_type="space", path_or_fileobj="Dockerfile.space", path_in_repo="Dockerfile")
          api.upload_file(repo_id=space_id, repo_type="space", path_or_fileobj="deploy/space/README.md", path_in_repo="README.md")
          PY

      - name: Verify health
        env:
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request

          url = f"https://{os.environ['HF_SPACE_ID'].replace('/', '-').lower()}.hf.space/api/health"
          last = None
          for _ in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      last = json.load(response)
                  if last.get("model_loaded"):
                      print("model_loaded:", last)
                      raise SystemExit(0)
              except Exception as exc:
                  print("not ready:", exc)
              time.sleep(20)
          raise SystemExit(f"health check failed: {last}")
          PY
