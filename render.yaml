# Render blueprint: free Docker web service for the FastAPI backend.
# Create it once with Render -> New -> Blueprint -> this repository. Render asks for the one
# `sync: false` secret (the Supabase pooler URL) and generates the two random secrets itself.
services:
  - type: web
    name: phishlens-api
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PHISHLENS_AUTH_MODE
        value: supabase
      - key: PHISHLENS_SUPABASE_JWKS_URL
        value: https://vmbtdrmevlovvvfvtqmd.supabase.co/auth/v1/.well-known/jwks.json
      # Supabase anon key (a public value, not the service-role key). The backend needs it to
      # read the caller's own /auth/v1/user record and check that the address is confirmed.
      # The API base URL is derived from the JWKS URL above, so it is not set separately.
      - key: PHISHLENS_SUPABASE_ANON_KEY
        sync: false
      - key: PHISHLENS_CORS_ORIGINS
        value: https://phishlens-gules.vercel.app,http://localhost:5173
      - key: PHISHLENS_AUTO_TRAIN_DEMO
        value: "true"
      # Supabase -> Connect -> Session pooler URI; a bare postgresql:// is normalized to psycopg3.
      - key: PHISHLENS_DATABASE_URL
        sync: false
      - key: PHISHLENS_WEBHOOK_SECRET
        generateValue: true
      # The domain of the forwarding alias: u-<token>@<alias-domain>. Points to the Cloudflare
      # Email Routing domain whose MX records forward to Worker `phishlens-inbound`.
      - key: PHISHLENS_ALIAS_DOMAIN
        value: phislens.dpdns.org
      - key: PHISHLENS_ADMIN_TOKEN
        generateValue: true
